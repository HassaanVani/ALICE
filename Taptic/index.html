<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extremis</title>
  <meta name="description" content="Explore 3D environments using hand gestures">
  <meta http-equiv="Permissions-Policy" content="camera=self">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
</head>

<body>
  <div id="app">
    <canvas id="scene-canvas"></canvas>

    <div id="webcam-container">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="hand-canvas"></canvas>
      <div id="gesture-indicator">
        <span id="gesture-text">Ready</span>
      </div>
    </div>

    <div id="hand-cursor">
      <div class="cursor-ring"></div>
    </div>

    <div id="scene-dropdown">
      <button id="dropdown-toggle">
        <span id="current-scene-label">Solar System</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
      <div id="dropdown-menu" class="hidden">
        <div class="dropdown-section">
          <div class="dropdown-label">Space</div>
          <button class="dropdown-item active" data-scene="solar-system">Solar System</button>
          <button class="dropdown-item" data-scene="earth">Earth</button>
          <button class="dropdown-item" data-scene="mars">Mars</button>
          <button class="dropdown-item" data-scene="galaxy">Galaxy</button>
          <button class="dropdown-item" data-scene="black-hole">Black Hole</button>
        </div>
        <div class="dropdown-section">
          <div class="dropdown-label">Science</div>
          <button class="dropdown-item" data-scene="gold-atom">Gold Atom</button>
          <button class="dropdown-item" data-scene="dna">DNA</button>
          <button class="dropdown-item" data-scene="cell">Cell</button>
          <button class="dropdown-item" data-scene="brain">Brain</button>
        </div>
        <div class="dropdown-section">
          <div class="dropdown-label">Interactive</div>
          <button class="dropdown-item" data-scene="ui-demo">2D Interface</button>
          <button class="dropdown-item" data-scene="particle-room">Particle Room</button>
          <button class="dropdown-item" data-scene="molecule-maker">Molecule Maker</button>
        </div>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item upload-item" id="upload-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          Upload Model
        </button>
      </div>
      <input type="file" id="model-upload" accept=".glb,.gltf" hidden>
    </div>

    <div id="controls-panel">
      <button id="panel-toggle">
        <span>Settings</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>

      <div class="panel-content">
        <div class="control-group">
          <div class="control-header">
            <span>Zoom</span>
            <span id="zoom-value">1.0×</span>
          </div>
          <input type="range" id="zoom-sensitivity" min="0.1" max="10" step="0.1" value="1">
        </div>

        <div class="control-group">
          <div class="control-header">
            <span>Rotation</span>
            <span id="rotation-value">1.0×</span>
          </div>
          <input type="range" id="rotation-sensitivity" min="0.1" max="10" step="0.1" value="1">
        </div>

        <div class="control-group">
          <div class="control-header">
            <span>Pan</span>
            <span id="pan-value">1.0×</span>
          </div>
          <input type="range" id="pan-sensitivity" min="0.1" max="10" step="0.1" value="1">
        </div>

        <div class="divider"></div>

        <div class="gesture-hints">
          <div class="hint"><span class="key">Pinch</span> + hold = zoom</div>
          <div class="hint"><span class="key">Pinch</span> + drag = pan</div>
          <div class="hint"><span class="key">Grip</span> + move = rotate</div>
          <div class="hint"><span class="key">Coyote</span> = recenter</div>
        </div>
      </div>
    </div>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <p>Initializing camera...</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
