# A.L.I.C.E. Configuration
# Adaptive Learning Interface for Cognitive Exploration

mode: idle
simulate: true

hardware:
  arm:
    port: null           # auto-detect if null
    baudrate: 115200
  magnet:
    port: null
    pin: 13
  imu:
    port: null
  gripper_type: suction
  suction_pin: 5

cameras:
  overhead:
    device_id: 0
    width: 1920
    height: 1080
    fps: 60
  front:
    device_id: 1
    width: 1280
    height: 720
    fps: 30

websocket:
  tensor_host: localhost
  tensor_port: 8765
  puppet_host: localhost
  puppet_port: 8766
  audience_port: 8767

narration:
  enabled: false
  voice_rate: 175
  min_interval: 8
  model: gemini-pro
  llm_timeout: 10.0

personality:
  # Voice gate — opinion strength must exceed this to trigger speech
  speech_threshold: 0.7
  speech_cooldown: 15.0         # seconds between voice outputs
  override_comment_threshold: 3 # consecutive overrides before she comments

  # Movement dynamics
  speed_self_initiated: 1.3     # faster — she wants to do this
  speed_user_requested: 1.0     # baseline
  speed_crowd_requested: 0.9    # slightly slower
  speed_override: 0.6           # noticeably slow — she disagrees

  # Idle behavior thresholds (seconds)
  idle_micro_motion_delay: 3.0  # start subtle scanning after this
  idle_tetris_delay: 30.0       # drift to tetris when someone's present
  idle_tetris_delay_alone: 10.0 # faster when nobody's around

  # Idle micro-motion parameters
  micro_amplitude_deg: 2.0      # degrees — subtle
  micro_period_s: 4.0           # seconds — slow breathing rhythm

selftest:
  enabled: true
  halt_on_failure: false

recording:
  enabled: false
  output_dir: recordings

timing:
  idle_loop_s: 0.1        # idle mode poll interval
  sort_loop_s: 0.016      # sort/rebellion detection loop (~60fps)
  camera_poll_s: 0.01     # camera retry when no frame

tetris_screen:
  board_left: 0
  board_top: 0
  board_width: 300
  board_height: 600
  key_calibration_path: tetris_key_calibration.json
